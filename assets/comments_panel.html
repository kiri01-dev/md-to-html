<aside id="panel" class="panel" aria-label="Comments" data-uncommentable>
    <div class="panel-h"><span>Comments</span><button type="button" id="btn-close" class="x" aria-label="Close comments">✕</button></div>
    <p id="empty" class="empty">No comments yet. Select text in the document or click + next to a paragraph.</p>
    <ol id="list" class="list"></ol>
    <div class="panel-foot">
      <button type="button" id="btn-import" class="btn ghost small">Load comments file</button>
      <button type="button" id="btn-clear" class="btn ghost small danger">Delete all</button>
      <input type="file" id="file-import" accept=".json,.md,.txt" hidden>
    </div>
  </aside>
