<div class="bar" data-uncommentable>
    <span class="bar-help"><b>Comment:</b> select any text, or hover a paragraph or row and click <span class="plus-demo">+</span>. Comments save in this browser automatically.</span>
    <span class="bar-actions">
      <button type="button" id="btn-export" class="btn">Save comments as file</button>
      <button type="button" id="btn-copy" class="btn ghost">Copy comments</button>
      <button type="button" id="btn-panel" class="btn ghost" aria-controls="panel" aria-expanded="true">Comments <span id="count" class="count">0</span></button>
    </span>
  </div>
